<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- BuildXI. The mark redrawn with heavier strokes than the logo so the
       crossed bats still read at 16px. Ground line dropped at this size. -->
  <rect width="64" height="64" rx="13" fill="#071238"/>
  <!-- Both bats carry a ground-coloured stroke, so the one drawn second cuts a
       clean dark gap where they cross instead of merging into a blob. -->
  <g transform="translate(23 32) rotate(-34)" fill="#FFFFFF" stroke="#071238" stroke-width="1.6">
    <rect x="-2.5" y="-24" width="5" height="14" rx="2"/>
    <path d="M-6 -10 H6 V16 Q6 23 0 24 Q-6 23 -6 16 Z"/>
  </g>
  <g transform="translate(23 32) rotate(34)" fill="#FFFFFF" stroke="#071238" stroke-width="1.6">
    <rect x="-2.5" y="-24" width="5" height="14" rx="2"/>
    <path d="M-6 -10 H6 V16 Q6 23 0 24 Q-6 23 -6 16 Z"/>
  </g>
  <rect x="48.5" y="14" width="7" height="38" rx="1.5" fill="#5AC2FF"/>
  <rect x="45" y="8.5" width="14" height="4" rx="2" fill="#5AC2FF"/>
</svg>
